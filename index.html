<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>张三 - 数字名片</title>
<style>
:root {
  --bg1: #f5f9ff;
  --bg2: #e6f1fd;
  --ink: #1e4a7a;
  --ink-body: #2c5282;
  --ink-sub: #5e80ab;
  --blue: #0066ff;
  --blue-2: #00b4ff;
  --blue-soft: #e3f0ff;
  --card: #ffffff;
  --line: rgba(30, 74, 122, 0.08);
  --shadow: 0 8px 24px rgba(30, 74, 122, 0.08);
  --grad-blue: linear-gradient(135deg, #0066ff, #00b4ff);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(180deg, var(--bg1), var(--bg2));
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  top: -120px;
  right: -90px;
  width: 340px;
  height: 340px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0, 102, 255, 0.09), transparent 70%);
  pointer-events: none;
}
body::after {
  content: '';
  position: fixed;
  bottom: -110px;
  left: -90px;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0, 180, 255, 0.08), transparent 70%);
  pointer-events: none;
}
.page { width: 100%; max-width: 430px; position: relative; z-index: 1; }

/* ---------- 页首 banner 轮播通栏 ---------- */
.carousel {
  position: relative;
  width: 100%;
  aspect-ratio: 800 / 235;
  background: #d9e9fc;
  overflow: hidden;
  z-index: 1;
}
.carousel-track { display: flex; height: 100%; transition: transform 0.5s ease; }
.carousel-slide { flex: 0 0 100%; height: 100%; }
.carousel-slide a { display: block; width: 100%; height: 100%; }
.carousel-slide img { width: 100%; height: 100%; object-fit: contain; display: block; }
.carousel-dots {
  position: absolute;
  bottom: 9px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 6px;
  z-index: 3;
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.9);
  box-shadow: 0 1px 3px rgba(16, 42, 77, 0.3);
  cursor: pointer;
  transition: all 0.3s ease;
}
.dot.active {
  width: 18px;
  border-radius: 4px;
  background: linear-gradient(90deg, #0066ff, #00b4ff);
  box-shadow: none;
}

/* ---------- 头部卡片（头像压 banner 破型） ---------- */
.header-card {
  position: relative;
  z-index: 2;
  margin: 0 14px;
  background: var(--card);
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding: 0 14px 16px;
}
.header-row { display: flex; align-items: flex-start; gap: 12px; padding-top: 50px; }
.avatar {
  width: 92px;
  height: 92px;
  border-radius: 50%;
  background: var(--grad-blue);
  padding: 3px;
  box-shadow: 0 6px 16px rgba(0, 102, 255, 0.22);
  margin-top: -96px;
  flex-shrink: 0;
}
.avatar span {
  display: flex;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: #ffffff;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  font-weight: 700;
  color: var(--blue);
}
.who { flex: 1; min-width: 0; padding-top: 4px; }
.name { font-size: 26px; font-weight: 700; line-height: 1.25; letter-spacing: 1px; }
.role { font-size: 16px; color: var(--blue); font-weight: 600; margin-top: 3px; }
.dept { font-size: 14px; color: var(--ink-sub); margin-top: 2px; }
.icons {
  display: grid;
  grid-template-columns: repeat(2, 36px);
  gap: 8px;
  flex-shrink: 0;
  padding-top: 4px;
}
.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: var(--blue-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--blue);
  text-decoration: none;
  transition: transform 0.15s ease;
}
.icon-btn:active { transform: scale(0.92); }
.icon-btn svg { width: 18px; height: 18px; }

/* ---------- 折叠卡片 ---------- */
.fold-card {
  margin: 12px 14px 0;
  background: var(--card);
  border-radius: 16px;
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}
.fold-card:active { transform: scale(0.985); }
.fold-card.sel { border-color: rgba(0, 102, 255, 0.35); box-shadow: 0 8px 24px rgba(0, 102, 255, 0.14); }
.fold-info { flex: 1; min-width: 0; }
.fold-title { font-size: 16px; font-weight: 600; color: var(--ink); }
.fold-sub { font-size: 13px; color: var(--ink-sub); margin-top: 3px; line-height: 1.5; }
.fold-arrow { color: #9db6d4; font-size: 20px; line-height: 1; flex-shrink: 0; font-family: sans-serif; }

/* ---------- 页脚 ---------- */
.footer { text-align: center; padding: 28px 0 32px; }
.footer-logo { height: 30px; opacity: 0.92; }
.slogan { font-size: 12px; color: #5e80ab; margin-top: 9px; letter-spacing: 1px; }

/* ---------- 通用弹窗 ---------- */
.modal { position: fixed; inset: 0; z-index: 50; display: none; }
.modal.open { display: block; }
.modal-mask { position: absolute; inset: 0; background: rgba(16, 42, 77, 0.45); }
.modal-box {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(86vw, 360px);
  max-height: 76vh;
  overflow-y: auto;
  background: #ffffff;
  border-radius: 20px;
  padding: 22px 20px 20px;
  box-shadow: 0 18px 48px rgba(16, 42, 77, 0.25);
}
.modal-close {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: #eef4fc;
  color: #5e80ab;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
}
.m-title { font-size: 19px; font-weight: 700; color: var(--ink); margin-bottom: 14px; }
.p-item { padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px dashed var(--line); }
.p-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.p-name { font-size: 16px; font-weight: 600; color: var(--ink); }
.p-desc { font-size: 14px; color: var(--ink-body); line-height: 1.7; margin-top: 4px; }
.p-link { display: inline-block; font-size: 14px; font-weight: 600; color: var(--blue); text-decoration: none; margin-top: 6px; }
.c-name { font-size: 18px; font-weight: 700; color: var(--ink); line-height: 1.5; }
.c-addr { font-size: 14px; color: var(--ink-sub); line-height: 1.7; margin-top: 8px; }
.bio-text { font-size: 16px; color: var(--ink-body); line-height: 1.9; }

/* ---------- 微信弹层 ---------- */
.wx-box { text-align: center; width: min(80vw, 320px); }
.wx-title { font-size: 19px; font-weight: 700; color: var(--ink); }
.wx-qr-wrap {
  width: 200px;
  height: 200px;
  margin: 16px auto 12px;
  border-radius: 12px;
  overflow: hidden;
  background: #ffffff;
  border: 1px solid var(--line);
}
.wx-qr-wrap img { width: 100%; height: 100%; object-fit: contain; display: block; }
.wx-tip { font-size: 14px; color: var(--ink-sub); line-height: 1.6; }

/* ---------- Toast ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: 60px;
  transform: translateX(-50%) translateY(10px);
  background: rgba(16, 42, 77, 0.88);
  color: #ffffff;
  font-size: 13px;
  padding: 9px 18px;
  border-radius: 999px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
  z-index: 99;
  max-width: 80vw;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

<div class="toast" id="toast"></div>

<script>
(function () {
  /* ---------- banner 轮播 ---------- */
  var track = document.getElementById('track');
  var slides = track.children.length;
  var dots = document.getElementById('dots');
  var car = document.getElementById('carousel');
  var cur = 0;
  var timer = null;

  function go(n) {
    cur = (n + slides) % slides;
    track.style.transform = 'translateX(-' + (cur * 100) + '%)';
    for (var j = 0; j < dots.children.length; j++) {
      dots.children[j].classList.toggle('active', j === cur);
    }
  }
  function restart() {
    if (timer) clearInterval(timer);
    timer = setInterval(function () { go(cur + 1); }, 4000);
  }
  for (var i = 0; i < slides; i++) {
    (function (idx) {
      var d = document.createElement('span');
      d.className = 'dot' + (idx === 0 ? ' active' : '');
      d.addEventListener('click', function () { go(idx); restart(); });
      dots.appendChild(d);
    })(i);
  }
  restart();

  var startX = 0, startY = 0;
  car.addEventListener('touchstart', function (e) {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });
  car.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - startX;
    var dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
      e.preventDefault();
      go(dx < 0 ? cur + 1 : cur - 1);
      restart();
    }
  }, { passive: false });

  /* ---------- 详情弹窗（data-module 复用） ---------- */
  var MOD = {
    products:
      '<div class="m-title">产品展示</div>' +
      '<div class="p-item">' +
        '<div class="p-name">花卷聆记</div>' +
        '<div class="p-desc">AI 录音转写工具，会议访谈录音转文字，自动生成纪要。</div>' +
        '<a class="p-link" href="https://www.ctyun.cn/act/huajuan/2026" target="_blank" rel="noopener">了解详情 ›</a>' +
      '</div>' +
      '<div class="p-item">' +
        '<div class="p-name">息壤智算</div>' +
        '<div class="p-desc">天翼云智算服务平台，提供算力与 AI 开发能力支撑。</div>' +
        '<a class="p-link" href="https://www.ctyun.cn/products/ctxirang" target="_blank" rel="noopener">了解详情 ›</a>' +
      '</div>' +
      '<div class="p-item">' +
        '<div class="p-name">TeleAgent</div>' +
        '<div class="p-desc">星辰超级智能体，日常办公场景的 AI 助手。</div>' +
        '<a class="p-link" href="https://www.teleai.com.cn/product/teleagent" target="_blank" rel="noopener">了解详情 ›</a>' +
      '</div>',
    company:
      '<div class="m-title">企业信息</div>' +
      '<div class="c-name">中国电信股份有限公司漳州分公司</div>' +
      '<div class="c-addr">地址：漳州市芗城区胜利路6号电信大楼</div>' +
      '<a class="p-link" href="https://baike.baidu.com/item/%E4%B8%AD%E5%9B%BD%E7%94%B5%E4%BF%A1%E8%82%A1%E4%BB%BD%E6%9C%89%E9%99%90%E5%85%AC%E5%8F%B8%E6%BC%B3%E5%B7%9E%E5%88%86%E5%85%AC%E5%8F%B8/51766485" target="_blank" rel="noopener">查看企业认证信息 ›</a>',
    bio:
      '<div class="m-title">个人简介</div>' +
      '<div class="bio-text">中国电信漳州分公司政企客户部客户经理，面向政企客户提供信息化解决方案咨询与服务，覆盖云网融合、数字化平台等场景，以专业与真诚服务每一位客户的数智化需求。</div>'
  };

  var modal = document.getElementById('detailModal');
  var modalContent = document.getElementById('modalContent');
  var foldCards = document.querySelectorAll('.fold-card');

  foldCards.forEach(function (card) {
    card.addEventListener('click', function () {
      var key = card.getAttribute('data-module');
      modalContent.innerHTML = MOD[key] || '';
      modal.classList.add('open');
      foldCards.forEach(function (x) { x.classList.remove('sel'); });
      card.classList.add('sel');
    });
  });
  function closeDetail() {
    modal.classList.remove('open');
    foldCards.forEach(function (x) { x.classList.remove('sel'); });
  }
  document.getElementById('modalClose').addEventListener('click', closeDetail);
  document.getElementById('modalMask').addEventListener('click', closeDetail);

  /* ---------- 微信弹层 ---------- */
  var wxModal = document.getElementById('wxModal');
  document.getElementById('wxBtn').addEventListener('click', function () {
    wxModal.classList.add('open');
  });
  document.getElementById('wxClose').addEventListener('click', function () {
    wxModal.classList.remove('open');
  });
  document.getElementById('wxMask').addEventListener('click', function () {
    wxModal.classList.remove('open');
  });

  /* ---------- Toast ---------- */
  var toast = document.getElementById('toast');
  var toastTimer = null;
  window.showToast = function (msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1800);
  };
})();
</script>
